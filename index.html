<script>
      if ('serviceWorker' in navigator) {
    function registerSW() {
      navigator.serviceWorker.register('/sw.js')
        .then(function(reg) {
          console.log('JoraApps faol:', reg.scope);
          
          reg.addEventListener('updatefound', function() {
            var newWorker = reg.installing;
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                if (!window.isUserPlaying) {
                  window.location.reload();
                } else {
                  window.updatePending = true;
                }
              }
            });
          });
        })
        .catch(function(err) {
          console.error('Service Worker xatoligi:', err)
        });
    }

    // Brauzer tayyor bo'lsa darhol ishlat, bo'lmasa yuklanishini kut
    if (document.readyState === 'complete') {
      registerSW();
    } else {
      window.addEventListener('load', registerSW);
    }
  }

  async function requestWakeLock() {
      try {
        const wakeLock = await navigator.wakeLock.request('screen');
        console.log('Ekran o‘chmaydi!');
      } catch (err) {
        console.warn('WakeLock faollashmadi:', err);
      }
    }
    
    // Foydalanuvchi ilova bilan ishlashni boshlaganda chaqiring
    window.addEventListener('click', requestWakeLock, { once: true });
    </script>
